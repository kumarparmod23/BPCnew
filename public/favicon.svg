<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003675"/>
      <stop offset="50%" stop-color="#00529b"/>
      <stop offset="100%" stop-color="#0077c8"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0077c8"/>
      <stop offset="100%" stop-color="#00a3e0"/>
    </linearGradient>
  </defs>

  <!-- Background circular base for high contrast in browser tabs -->
  <rect width="512" height="512" rx="100" fill="#ffffff"/>
  
  <!-- Outer Shield Crest -->
  <path d="M 256 36 L 416 88 C 416 260 350 360 256 416 C 162 360 96 260 96 88 Z" 
        fill="none" stroke="url(#shieldGrad)" stroke-width="26" stroke-linejoin="round"/>
        
  <!-- Inner Shield Accent Line -->
  <path d="M 256 64 L 388 106 C 388 244 332 328 256 376 C 180 328 124 244 124 106 Z" 
        fill="none" stroke="#e1f0fa" stroke-width="8"/>

  <!-- Caring Hands Foundation -->
  <path d="M 120 280 C 130 360 190 410 256 440 C 190 415 150 375 140 310 C 140 290 170 330 220 370 C 170 330 145 285 140 240 C 160 280 200 320 245 340 C 215 305 185 240 185 180 C 205 230 235 280 256 300 C 277 280 307 230 327 180 C 327 240 297 305 267 340 C 312 320 352 280 372 240 C 367 285 342 330 292 370 C 342 330 372 290 372 310 C 362 375 322 415 256 440 C 322 410 382 360 392 280 Z" 
        fill="url(#shieldGrad)"/>

  <!-- Ayurvedic Healing Tri-Leaf -->
  <path d="M 256 265 C 246 295 246 325 256 345 C 266 325 266 295 256 265 Z" fill="url(#leafGrad)"/>
  <path d="M 235 285 C 220 305 210 325 225 340 C 240 335 245 315 245 295 Z" fill="url(#leafGrad)"/>
  <path d="M 277 285 C 292 305 302 325 287 340 C 272 335 267 315 267 295 Z" fill="url(#leafGrad)"/>

  <!-- Bold Central 'BPC+' Monogram -->
  <text x="246" y="215" 
        font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" 
        font-size="118" 
        font-weight="900" 
        fill="#003675" 
        text-anchor="middle" 
        letter-spacing="2">BPC</text>

  <!-- Medical Cross Symbol -->
  <rect x="338" y="166" width="22" height="7" rx="3.5" fill="#0077c8"/>
  <rect x="345.5" y="158.5" width="7" height="22" rx="3.5" fill="#0077c8"/>
</svg>
